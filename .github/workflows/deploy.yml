name: Deploy to Azure Container Apps

# Mirrors `./deploy-aca.sh redeploy`. It does NOT run first-time setup — the resource
# group, ACR, environment, and the three container apps must already exist, along with
# their secrets (openai-api-key, postgres-url, postgres-url-sim-ready, app-password).
# Run ./deploy-aca.sh once to create them.
#
# Replaces an older workflow that deployed to Azure Container *Instances* in
# `medical-case-generator-rg` — infrastructure that is no longer the live deployment.
#
# Database migrations are NOT run here. The shared schema is owned by Alembic in the
# direct-sim repo; see direct-sim/MIGRATIONS.md. If a migration adds tables this app
# needs, deploy direct-sim first — this backend detects the authoring schema at startup
# and logs "Authoring persistence: enabled" or "DISABLED".

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

env:
  RESOURCE_GROUP: casegen-rg
  ACR_NAME: casegenacr
  APP: casegen

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # This repo had no secrets configured at all as of 2026-07-28, so CI could never
      # deploy. Fail with an actionable message rather than a cryptic azure/login error.
      - name: Check required secrets
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -z "$AZURE_CREDENTIALS" ]; then
            echo "::error::AZURE_CREDENTIALS is not set, so this workflow cannot deploy."
            echo "::error::Create a service principal with contributor on ${{ env.RESOURCE_GROUP }}"
            echo "::error::and AcrPush on ${{ env.ACR_NAME }}, then store the JSON as a repository"
            echo "::error::secret named AZURE_CREDENTIALS. Until then, deploy with:"
            echo "::error::  ./deploy-aca.sh redeploy"
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build backend image
        run: |
          az acr build --registry ${{ env.ACR_NAME }} \
            --image ${{ env.APP }}-backend:${{ github.sha }} \
            --image ${{ env.APP }}-backend:v1 \
            --file Dockerfile.backend --platform linux/amd64 .

      - name: Build frontend image
        run: |
          az acr build --registry ${{ env.ACR_NAME }} \
            --image ${{ env.APP }}-frontend:${{ github.sha }} \
            --image ${{ env.APP }}-frontend:v1 \
            --file Dockerfile.frontend --platform linux/amd64 .

      - name: Update backend container app
        run: |
          az containerapp update \
            --name ${{ env.APP }}-backend \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.APP }}-backend:${{ github.sha }}

      - name: Update frontend container app
        run: |
          az containerapp update \
            --name ${{ env.APP }}-frontend \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.APP }}-frontend:${{ github.sha }}

      - name: Report URLs and authoring status
        run: |
          FRONTEND=$(az containerapp show --name ${{ env.APP }}-frontend \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          BACKEND=$(az containerapp show --name ${{ env.APP }}-backend \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Frontend: https://$FRONTEND"
          echo "Backend:  https://$BACKEND"
          echo ""
          echo "Confirm the authoring schema was detected:"
          echo "  az containerapp logs show --name ${{ env.APP }}-backend \\"
          echo "    --resource-group ${{ env.RESOURCE_GROUP }} --tail 100 | grep 'Authoring persistence'"
