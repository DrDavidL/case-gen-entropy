name: Secret scan

# The backstop behind .pre-commit-config.yaml. A local hook is skippable — `--no-verify`,
# a fresh clone where nobody ran `pre-commit install`, a commit made from a web editor —
# so the authoritative scan runs here, where it cannot be bypassed.
#
# Runs on pull requests too, not just pushes to main. A secret found after it has already
# landed on main is a rotation incident; found on the branch it is an edit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only. The scan needs nothing else, and a leaked token from an over-permissioned
# workflow would be its own version of the problem this job exists to catch.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Load-bearing. The default shallow clone scans only the tip, so a secret
          # committed earlier and deleted later would pass — while still being trivially
          # recoverable from history, which is the whole reason to scan.
          fetch-depth: 0

      # v3 rather than the v2 most guides still show: v2 runs on Node 20, which GitHub
      # removes from hosted runners on 2026-09-16. v3 is the same action on Node 24 —
      # identical inputs, outputs, and behaviour.
      #
      # GITLEAKS_LICENSE is required only for repositories owned by a GitHub
      # Organization. This repo is under a personal account, so it is intentionally absent.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
